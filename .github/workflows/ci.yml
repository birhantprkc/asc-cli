name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SWIFT_VERSION: "6.2"

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links, budgets and changelog
        run: python3 scripts/check-docs.py --strict

      - name: Changelog release scripts
        run: scripts/test-changelog-release.sh

  test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Generated docs are up to date
        run: |
          python3 scripts/gen-docs.py .build/release/asc
          git diff --exit-code docs/commands.md docs/README.md \
            || { echo "::error::Run 'make docs' and commit docs/commands.md and docs/README.md"; exit 1; }

      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Generate lcov report
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          XCTEST="$BIN_PATH/asc-cliPackageTests.xctest/Contents/MacOS/asc-cliPackageTests"
          PROFDATA="$BIN_PATH/codecov/default.profdata"
          xcrun llvm-cov export "$XCTEST" \
            -instr-profile "$PROFDATA" \
            -format=lcov \
            -ignore-filename-regex=".build|Tests|Commands/TUI|Commands/Auth|Commands/Version/|Commands/Web/|ClientProvider|ClientFactory|BrowserIrisCookieProvider|IrisClient|Infrastructure/Iris/Auth/|Infrastructure/Iris/AppBundles/|Infrastructure/ScreenshotPlans/WebKitHTMLRenderer|Infrastructure/Skills/ShellRunner|Infrastructure/Plugins/PluginMarketRepository|Infrastructure/Web/|ASCPlugin/PluginLoader|ASC\.swift" \
            > coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tddworks/asc-cli
          files: coverage.lcov
          fail_ci_if_error: true
